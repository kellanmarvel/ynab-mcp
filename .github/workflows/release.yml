name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate release notes
      id: release_notes
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -n1)
        
        # Generate changelog
        if [ -z "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
        else
          CHANGELOG=$(git log ${PREVIOUS_TAG}..${{ github.ref_name }} --pretty=format:"* %s (%h)" --no-merges)
        fi
        
        # Create release notes
        cat > release_notes.md << EOF
        ## What's Changed
        
        ${CHANGELOG}
        
        ## Installation
        
        ### Using Pre-built Binaries
        Download the appropriate binary for your platform from the assets below.
        
        ### Using Cargo
        \`\`\`bash
        cargo install ynab-mcp --version ${{ github.ref_name }}
        \`\`\`
        
        ### Using Git
        \`\`\`bash
        cargo install --git https://github.com/${{ github.repository }} --tag ${{ github.ref_name }}
        \`\`\`
        
        ## Usage
        
        See the [README](https://github.com/${{ github.repository }}#readme) and [API documentation](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/API.md) for usage instructions.
        EOF

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: YNAB MCP Server ${{ github.ref_name }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  build-binaries:
    name: Build Binaries
    needs: create-release
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Don't cancel other builds if one fails
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: ynab-mcp-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: ynab-mcp-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: ynab-mcp-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: ynab-mcp-windows-x86_64.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: release-${{ matrix.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          release-${{ matrix.os }}-${{ matrix.target }}-
          release-${{ matrix.os }}-

    - name: Build binary
      run: cargo build --release --target ${{ matrix.target }} --verbose

    - name: Prepare binary for upload
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cp target/${{ matrix.target }}/release/ynab-mcp.exe ${{ matrix.asset_name }}
        else
          cp target/${{ matrix.target }}/release/ynab-mcp ${{ matrix.asset_name }}
          chmod +x ${{ matrix.asset_name }}
        fi
        
        # Verify binary was created and is executable
        ls -la ${{ matrix.asset_name }}
        if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
          file ${{ matrix.asset_name }}
        fi

    - name: Upload binary to release
      uses: softprops/action-gh-release@v2
      if: success()  # Only upload if build succeeded
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        files: ${{ matrix.asset_name }}

  publish-crate:
    name: Publish to crates.io
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: publish-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Verify version matches tag
      run: |
        CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
        TAG_VERSION=${{ github.ref_name }}
        TAG_VERSION=${TAG_VERSION#v}  # Remove 'v' prefix

        if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Version mismatch: Cargo.toml has $CARGO_VERSION but tag is $TAG_VERSION"
          exit 1
        fi

        echo "✅ Version matches: $CARGO_VERSION"


    - name: Run tests before publishing
      run: cargo test --verbose --lib
      env:
        YNAB_API_TOKEN: "test-token"
        YNAB_BLOCK_TEST_TOKENS: "false"
        READ_ONLY_MODE: "true"

    - name: Publish to crates.io
      run: cargo publish --verbose
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}