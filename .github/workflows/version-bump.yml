name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version (optional, overrides version_type)'
        required: false
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-edit
      run: cargo install cargo-edit

    - name: Bump version
      run: |
        if [ -n "${{ github.event.inputs.custom_version }}" ]; then
          # Use custom version
          cargo set-version ${{ github.event.inputs.custom_version }}
          NEW_VERSION=${{ github.event.inputs.custom_version }}
        else
          # Use version type bump
          cargo set-version --bump ${{ github.event.inputs.version_type }}
          NEW_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
        fi

        echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

    - name: Update Cargo.lock
      run: cargo update --package ynab-mcp

    - name: Run tests
      run: cargo test --verbose --lib
      env:
        YNAB_API_TOKEN: "test-token"
        YNAB_BLOCK_TEST_TOKENS: "false"
        READ_ONLY_MODE: "true"

    - name: Commit and tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add Cargo.toml Cargo.lock
        git commit -m "chore: bump version to $NEW_VERSION"

        git tag "v$NEW_VERSION"
        git push origin HEAD
        git push origin "v$NEW_VERSION"