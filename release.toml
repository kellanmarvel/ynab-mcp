[package]
# Don't push tags (let GitHub Actions handle releases)
push = false
# Don't publish to crates.io here (let GitHub Actions do it)
publish = false
# Run tests before release
pre-release-hook = ["cargo", "test", "--lib"]
# Consolidate version bump and dependency updates into single commit
consolidate-commits = true

[package.metadata.release]
pre-release-commit-message = "chore: release version {{version}}"
tag-message = "v{{version}}"