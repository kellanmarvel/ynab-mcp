[package]
name = "ynab-mcp"
version = "0.1.4"
edition = "2021"
description = "Model Context Protocol server for YNAB (You Need A Budget)"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
# HTTP client for YNAB API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Decimal arithmetic for currency
rust_decimal = { version = "1.35", features = ["serde-float"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration  
dotenvy = "0.15"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }
keyring = { version = "3.6.3", features = ["linux-native"] }
secrecy = { version = "0.10.3", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
zeroize = { version = "1.8.1", features = ["derive"] }


# High-performance concurrent hashmap for cache
dashmap = "6.1"

[dev-dependencies]
# Testing framework
tokio-test = "0.4"
mockito = "1.4"
wiremock = "=0.6.3"
assert_matches = "1.5"
tempfile = "3.8"
serial_test = "3.0"

# Code coverage
cargo-tarpaulin = "0.31"

# Optimization profiles for smaller binary size
[profile.release]
opt-level = 3          # Maximum optimization
lto = "thin"           # Link-time optimization (thin is faster than full)
codegen-units = 1      # Better optimization with single unit
panic = "abort"        # No stack unwinding reduces size
strip = "symbols"      # Remove debug symbols

# Further optimized release profile
[profile.release-small]
inherits = "release"
opt-level = "z"        # Optimize for size
lto = "fat"           # Full link-time optimization for smaller size
